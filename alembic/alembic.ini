# ============================================================================
# Alembic configuration file
# ============================================================================
# This file is read by `alembic` and configures the migration environment.
# The actual database URL is injected by env.py from the application settings,
# so the value below is only a fallback for direct alembic CLI invocations.

[alembic]
# Path to migration scripts directory, relative to this file's location.
script_location = alembic

# Template for new revision files (relative to script_location).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path additions so that Python can import from the project root.
prepend_sys_path = .

# Timezone to use for the filename timestamp.
timezone = UTC

# Truncate long revision slugs at this many characters.
truncate_slug_length = 60

# Revision environment: set to true to use a separate script for every revision.
revision_environment = false

# Set to true to enable "sourceless" .pyc file migration scripts.
sourceless = false

# Version table name.  Changing this after first migration requires manual
# renaming in the database.
version_table = alembic_version

# Version table schema (leave empty for default schema).
version_table_schema =

# ─── Fallback database URL ───────────────────────────────────────────────────
# env.py overrides this at runtime using settings.DATABASE_URL.
# For asyncpg, the synchronous URL format is used by offline migrations only.
sqlalchemy.url = postgresql+asyncpg://jarvis:jarvis@localhost:5432/jarvis_db

# ─── Logging ─────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
