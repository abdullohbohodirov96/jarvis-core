# =============================================================================
# JARVIS — Nginx configuration
# =============================================================================
#
# Responsibilities:
#   - HTTP → HTTPS redirect (port 80 → 443)
#   - Reverse proxy to FastAPI (api:8000)
#   - WebSocket support (/ws/)
#   - SSE (Server-Sent Events) streaming (/api/v1/chat/stream)
#   - Gzip compression for text payloads
#   - Rate limiting (burst protection)
#   - Security headers (HSTS, CSP, X-Frame-Options, etc.)
#   - Static file serving (frontend build)
#   - Standalone /health endpoint (does not hit upstream)
#
# Usage: mounted read-only at /etc/nginx/nginx.conf
# =============================================================================

# Run as the nginx worker user
user nginx;

# Automatically set worker_processes to the number of CPU cores
worker_processes auto;

# File that stores the PID of the master process
pid /var/run/nginx.pid;

# Raise the limit of open file descriptors per worker process
worker_rlimit_nofile 65535;

# ---------------------------------------------------------------------------
# Error logging
# ---------------------------------------------------------------------------
error_log /var/log/nginx/error.log warn;

# ---------------------------------------------------------------------------
# Events
# ---------------------------------------------------------------------------
events {
    # Maximum simultaneous connections per worker
    worker_connections 4096;
    # Accept as many connections as possible when notified
    multi_accept on;
    # Use epoll on Linux for best performance
    use epoll;
}

# ---------------------------------------------------------------------------
# HTTP context
# ---------------------------------------------------------------------------
http {

    # ── MIME types ────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'rid="$http_x_request_id"';

    access_log /var/log/nginx/access.log main buffer=16k flush=5s;

    # ── Basic settings ────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75s;
    keepalive_requests  1000;
    types_hash_max_size 4096;
    server_tokens       off;    # Hide nginx version in headers/error pages

    # ── Client body ───────────────────────────────────────────────────────────
    client_max_body_size       50M;   # Allow audio file uploads
    client_body_buffer_size    128k;
    client_header_buffer_size  1k;
    large_client_header_buffers 4 8k;
    client_body_timeout        60s;
    client_header_timeout      30s;
    send_timeout               60s;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip                on;
    gzip_vary           on;
    gzip_comp_level     5;
    gzip_min_length     1024;
    gzip_proxied        any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        image/svg+xml
        font/opentype;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # General API rate limit: 30 req/s per IP (burst of 60 with nodelay)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=30r/s;

    # Auth endpoints: tighter limit (5 req/s to prevent brute-force)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Voice upload: 1 req/s (heavy processing)
    limit_req_zone $binary_remote_addr zone=voice_limit:5m rate=1r/s;

    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_conn conn_limit 100;

    # ── Upstream: FastAPI ─────────────────────────────────────────────────────
    upstream jarvis_api {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Proxy settings (shared across location blocks) ────────────────────────
    proxy_http_version      1.1;
    proxy_buffering         on;
    proxy_buffer_size       8k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;
    proxy_read_timeout      120s;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        X-Request-ID      $request_id;
    proxy_pass_header       X-Request-ID;

    # ── Map for WebSocket upgrade ─────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # =========================================================================
    # Server: HTTP (port 80) — redirect all traffic to HTTPS
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ACME / Let's Encrypt challenge passthrough (must come before redirect)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        # Lightweight health check that does NOT redirect to HTTPS
        # (used by load balancers / container healthchecks)
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Permanent redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # Server: HTTPS (port 443)
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;   # Replace with your domain in production

        # ── TLS configuration ─────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_session_cache   shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Mozilla "Intermediate" compatibility profile
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # OCSP stapling
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout    5s;

        # ── Security headers ──────────────────────────────────────────────────
        # Prevents browsers from MIME-sniffing a response away from declared type
        add_header X-Content-Type-Options    "nosniff"                          always;
        # Prevents page from being rendered in an <iframe> (clickjacking)
        add_header X-Frame-Options           "DENY"                             always;
        # Enables XSS filter in legacy browsers
        add_header X-XSS-Protection          "1; mode=block"                    always;
        # Forces HTTPS for 1 year, including subdomains (preload optional)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # Controls what information is sent in the Referer header
        add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
        # Restricts browser features (microphone access is required for voice)
        add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(self)" always;
        # Content Security Policy
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline'; "
            "style-src 'self' 'unsafe-inline'; "
            "img-src 'self' data: https:; "
            "connect-src 'self' wss: https:; "
            "font-src 'self'; "
            "frame-ancestors 'none'; "
            "base-uri 'self';"
            always;

        # ── Lightweight health check (no upstream hit) ────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok","tls":true}';
            add_header Content-Type application/json;
        }

        # ── Static frontend assets ────────────────────────────────────────────
        location /static/ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri $uri/ =404;
        }

        # Frontend SPA — serve index.html for all non-API routes
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ── WebSocket endpoint (/ws/) ─────────────────────────────────────────
        location /ws/ {
            proxy_pass         http://jarvis_api;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Longer timeouts for persistent connections
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            # Disable buffering for real-time communication
            proxy_buffering off;

            # No rate limiting on WS (connection itself is the gate)
        }

        # ── SSE streaming endpoint ────────────────────────────────────────────
        location /api/v1/chat/stream {
            proxy_pass         http://jarvis_api;
            proxy_http_version 1.1;

            proxy_set_header Connection "";   # disable keep-alive chunking

            # SSE requires no buffering so the client receives chunks immediately
            proxy_buffering         off;
            proxy_cache             off;
            proxy_read_timeout      600s;
            proxy_send_timeout      600s;

            chunked_transfer_encoding on;

            add_header X-Accel-Buffering no;

            limit_req zone=api_limit burst=20 nodelay;
        }

        # ── Authentication endpoints (strict rate limit) ───────────────────────
        location ~ ^/api/v1/auth/(login|register|refresh) {
            proxy_pass http://jarvis_api;
            limit_req  zone=auth_limit burst=10 nodelay;
        }

        # ── Voice upload endpoint (per-IP 1 req/s) ───────────────────────────
        location /api/v1/voice/transcribe {
            proxy_pass             http://jarvis_api;
            client_max_body_size   100M;
            proxy_read_timeout     300s;
            limit_req              zone=voice_limit burst=3;
        }

        # ── All other API calls ───────────────────────────────────────────────
        location /api/ {
            proxy_pass http://jarvis_api;
            limit_req  zone=api_limit burst=60 nodelay;
        }

        # ── Flower (Celery monitoring) — protect with basic auth ───────────────
        location /flower/ {
            proxy_pass            http://flower:5555/flower/;
            proxy_redirect        off;
            proxy_set_header      Host $host;
            auth_basic            "Celery Monitoring";
            auth_basic_user_file  /etc/nginx/.htpasswd;
        }

        # ── Error pages ───────────────────────────────────────────────────────
        error_page 404              /404.html;
        error_page 500 502 503 504  /50x.html;

        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
